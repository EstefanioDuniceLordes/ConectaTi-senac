server.port=${PORT:8080}
spring.application.name=conectati-api

spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/,file:./static/}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/conectati;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo